<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contador de amigos</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #111827;
    font-family: Arial, sans-serif;
    color: white;
}

.box {
    text-align: center;
    background: #1f2937;
    padding: 35px;
    border-radius: 25px;
    width: 90%;
    max-width: 380px;
}

h1 {
    margin-top: 0;
}

#numero {
    font-size: 90px;
    font-weight: bold;
    margin: 25px 0;
}

button,
input {
    width: 100%;
    padding: 16px;
    border-radius: 12px;
    font-size: 20px;
}

button {
    border: 0;
    background: #22c55e;
    color: white;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
}

button:active {
    transform: scale(0.97);
}

input {
    border: 2px solid #374151;
    background: #111827;
    color: white;
    outline: none;
}

.establecer {
    background: #3b82f6;
}

label {
    display: block;
    margin-bottom: 8px;
    color: #d1d5db;
}
</style>

</head>

<body>

<div class="box">

```
<h1>Contador</h1>

<div id="numero">0</div>

<button onclick="sumar()">+1</button>

<br><br>

<label>¿Cuánto llevas?</label>

<input
    id="cantidad"
    type="number"
    min="0"
    placeholder="Ej: 37"
>

<button class="establecer" onclick="establecerNumero()">
    Establecer número
</button>
```

</div>

<script>

let numero = Number(localStorage.getItem("contador")) || 0;

mostrar();

function mostrar() {
    document.getElementById("numero").textContent = numero;
}

function sumar() {
    numero++;

    localStorage.setItem("contador", numero);

    mostrar();
}

function establecerNumero() {

    const campo = document.getElementById("cantidad");

    const nuevoNumero = Number(campo.value);

    if (campo.value === "" || nuevoNumero < 0) {
        return;
    }

    numero = nuevoNumero;

    localStorage.setItem("contador", numero);

    mostrar();

    campo.value = "";
}

</script>

</body>
</html>
